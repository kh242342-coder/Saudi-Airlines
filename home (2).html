<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Saudi Airlines - Welcome</title>
    <style>
        body { background-color: #001f3f; color: white; font-family: 'Calibri', sans-serif; margin: 0; padding: 0; }
        header { padding: 20px; background-color: #00152b; border-bottom: 2px solid #c5a059; text-align: center; }
        .logo { max-width: 200px; }
        
        /* Welcome interface design*/
        .hero { height: 70vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        h1 { font-size: 50px; color: #c5a059; margin-bottom: 10px; }
        p { font-size: 20px; margin-bottom: 30px; opacity: 0.8; }
        
        .btn-portal { 
            padding: 15px 50px; background-color: #c5a059; color: white; 
            text-decoration: none; border-radius: 30px; font-weight: bold; font-size: 18px;
            transition: 0.3s; border: 2px solid #c5a059;
        }
        .btn-portal:hover { background-color: transparent; color: #c5a059; }

        footer { position: fixed; bottom: 0; width: 100%; padding: 15px; background: #00152b; text-align: center; border-top: 1px solid #c5a059; font-size: 14px; }
    </style>
</head>
<body>
    <header><img src="logo.png" alt="Saudi Airlines" class="logo"></header>
    
    <div class="hero">
        <h1>Welcome to SAMS</h1>
        <p>Saudi Airline Management System</p>
        <a href="Login.html" class="btn-portal">Open Staff Portal</a>
    </div>

    <footer>&copy; 2026 Saudi Airlines - Vision 2030 Partner</footer>
</body>
</html>
