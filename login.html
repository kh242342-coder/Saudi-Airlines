<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAMS - Login Portal</title>
    <style>
        body { 
            background-color: #001f3f; 
            font-family: 'Calibri', sans-serif; 
            margin: 0; 
            color: #ffffff;
        }
        header { 
            padding: 15px; 
            text-align: center; 
            background-color: #00152b; 
            border-bottom: 2px solid #c5a059; 
        }
        .logo { max-width: 140px; }
        .container { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 85vh; 
        }
        .login-card { 
            background: white; 
            padding: 35px; 
            border-radius: 15px; 
            width: 100%; 
            max-width: 400px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            color: #001f3f; 
        }
        h2 { 
            text-align: center; 
            margin-bottom: 25px; 
            border-bottom: 2px solid #f0f0f0; 
            padding-bottom: 10px; 
        }
        .form-group { margin-bottom: 15px; text-align: left; }
        label { 
            display: block; 
            font-weight: bold; 
            margin-bottom: 5px; 
            font-size: 14px; 
        }
        input { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #ddd; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-family: Arial, sans-serif; /* لضمان ظهور الأرقام بوضوح */
        }
        
        /* لإجبار خانة التاريخ تظهر من اليسار لليمين */
        input[type="date"] {
            direction: ltr;
        }

        .row { display: flex; gap: 10px; }
        .row .form-group { flex: 1; }
        .btn-submit { 
            width: 100%; 
            padding: 14px; 
            background: #001f3f; 
            color: #c5a059; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 16px; 
            margin-top: 10px; 
        }
        .btn-submit:hover { background: #002d5c; }
        .back-link { 
            display: block; 
            text-align: center; 
            margin-top: 15px; 
            color: #666; 
            text-decoration: none; 
            font-size: 13px; 
        }
    </style>
</head>
<body>

    <header>
        <img src="logo.png" alt="Saudia Logo" class="logo">
    </header>
    
    <div class="container">
        <div class="login-card">
            <h2>Login Portal</h2>
            <form action="Home.html">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="name@saudia.com" required>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" placeholder="••••••••" required>
                </div>
                
                <div class="row">
                    <div class="form-group">
                        <label>From</label>
                        <input type="text" placeholder="e.g. JED">
                    </div>
                    <div class="form-group">
                        <label>To</label>
                        <input type="text" placeholder="e.g. RUH">
                    </div>
                </div>

                <div class="form-group">
                    <label>Flight Date</label>
               <input type="text" placeholder="MM/DD/YYYY" required>

                </div>
                
                <button type="submit" class="btn-submit">LOGIN & UPDATE</button>
            </form>
            <a href="Home.html" class="back-link">← Back to Welcome Page</a>
        </div>
    </div>

</body>
</html>
